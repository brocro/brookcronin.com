<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{site_title}}</title>
  <meta name="description" content="{{site_tagline}}">
  <link rel="icon" href="/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="{{site_title}} feed" href="/feed.xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1><a href="/">{{site_title}}</a></h1>
      <p class="tagline">{{site_tagline}}</p>
    </header>

    <ul class="posts">
      {{post_list}}
    </ul>

    <footer class="site-footer">
      <span>&copy; {{year}} {{author}}</span>
      <span class="site-footer-circle">A member of <a href="https://circle.brookcronin.com/">Brook&rsquo;s Circle</a> &middot; <a href="https://circle.brookcronin.com/s/0daxKfY5">verify</a></span>
      <a href="/feed.xml">RSS</a>
    </footer>
  </main>
</body>
</html>
